name: deploy-pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned

      - name: Detect lockfile
        id: lockfile
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            echo "has_lockfile=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_lockfile=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pinned
        if: ${{ steps.lockfile.outputs.has_lockfile == 'true' }}
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pinned
        if: ${{ steps.lockfile.outputs.has_lockfile != 'true' }}
        with:
          node-version: 20

      - name: Pin npm + registry
        shell: bash
        run: |
          set -euo pipefail
          # Avoid npm CLI flakiness across runner images
          npm i -g npm@10.9.2
          npm config set registry https://registry.npmjs.org/
          npm --version

      - name: Install (retry)
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ steps.lockfile.outputs.has_lockfile }}" = "true" ]; then
            cmd=(npm ci)
          else
            cmd=(npm install)
          fi

          for attempt in 1 2 3; do
            echo "Running: ${cmd[*]} (attempt ${attempt}/3)"
            if "${cmd[@]}"; then
              exit 0
            fi
            if [ ${attempt} -lt 3 ]; then
              sleep_time=$((attempt * 7))
              echo "Install failed; retrying in ${sleep_time}s..."
              sleep ${sleep_time}
            fi
          done

          echo "Install failed after retries."
          exit 1

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # pinned
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # pinned
